<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="256" viewBox="0 0 512 256">
  <title>Ashgrave dungeon floor and wall tile sprites</title>
  <desc>Reusable 128 by 64 isometric floor tiles and 128 by 96 wall tiles. Use an id with SVG use href.</desc>
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#514238"/><stop offset="1" stop-color="#302720"/></linearGradient>
    <linearGradient id="stone2" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#625044"/><stop offset="1" stop-color="#40342b"/></linearGradient>
    <pattern id="grain" width="17" height="13" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r=".7" fill="#c5a477" opacity=".12"/><circle cx="13" cy="9" r=".55" fill="#0b0908" opacity=".42"/></pattern>
    <g id="floor-base"><path d="M64 1 127 32 64 63 1 32Z" fill="url(#stone)" stroke="#17120f" stroke-width="1.5"/><path d="M64 1 127 32 64 63 1 32Z" fill="url(#grain)"/><path d="M64 2 124 32" fill="none" stroke="#89735a" stroke-opacity=".22"/></g>
    <g id="block-top"><path d="M64 1 127 32 64 63 1 32Z" fill="url(#stone2)" stroke="#17120f" stroke-width="1.5"/><path d="M64 1 127 32 64 63 1 32Z" fill="url(#grain)"/><path d="M64 2 124 32" fill="none" stroke="#b08d64" stroke-opacity=".32"/></g>
    <g id="wall-face">
      <path d="M1 32 64 63 64 95 1 64Z" fill="#2e251f" stroke="#17120f" stroke-width="1.5"/>
      <path d="M64 63 127 32 127 64 64 95Z" fill="#241d18" stroke="#17120f" stroke-width="1.5"/>
      <path d="M5 43 64 72 64 79 5 50M64 80 123 51 123 58 64 87" fill="none" stroke="#4b3b2e" stroke-width="1" opacity=".9"/>
      <path d="M5 55 64 84 64 91 5 62M64 88 123 59 123 66 64 95" fill="none" stroke="#433529" stroke-width="1" opacity=".75"/>
      <path d="M1 32 64 63 127 32" fill="none" stroke="#92775b" stroke-opacity=".4" stroke-width="1"/>
    </g>
    <symbol id="floor-stone" viewBox="0 0 128 64"><use href="#floor-base" xlink:href="#floor-base"/></symbol>
    <symbol id="floor-cracked" viewBox="0 0 128 64"><use href="#floor-base" xlink:href="#floor-base"/><path d="m44 23 7 5-4 5 10 3-3 7 8 5m-11-15-8 1m11 9 7-3" fill="none" stroke="#17120f" stroke-width="1.6"/><path d="m45 24 6 4m-4 5 9 3" fill="none" stroke="#8a7157" stroke-opacity=".45"/></symbol>
    <symbol id="floor-moss" viewBox="0 0 128 64"><use href="#floor-base" xlink:href="#floor-base"/><path d="M13 32q9-10 20-3t12 12q-12 8-24-1Z" fill="#596044" opacity=".7"/><path d="M89 24q12-6 23 3l-9 7-14-3Z" fill="#64704a" opacity=".58"/><path d="M20 34q9-5 17 2m57-9q8-3 14 2" fill="none" stroke="#879064" opacity=".55"/></symbol>
    <symbol id="floor-rune" viewBox="0 0 128 64"><use href="#floor-base" xlink:href="#floor-base"/><path d="m64 16 15 8v16l-15 8-15-8V24Zm0 5v22m-10-17 20 11m0-11L54 37" fill="none" stroke="#bd8b48" stroke-width="1.5" opacity=".82"/><circle cx="64" cy="32" r="2" fill="#e6b363"/></symbol>
    <symbol id="floor-blood" viewBox="0 0 128 64"><use href="#floor-base" xlink:href="#floor-base"/><path d="M78 33q10-9 18 0t15 4q-1 9-14 9t-19-5Z" fill="#6e2922" opacity=".86"/><path d="M94 40q3 5 1 9" stroke="#742a22" stroke-width="2"/></symbol>
    <symbol id="floor-rubble" viewBox="0 0 128 64"><use href="#floor-base" xlink:href="#floor-base"/><path d="m40 37 8-6 7 4-4 7-8 1Zm18 6 6-7 7 4-3 7-8 1Zm-7-15 5-5 5 3-2 5-6 1Zm21 12 4-5 5 2-1 5-6 1Z" fill="#796553" stroke="#211a15" stroke-width="1"/></symbol>
    <symbol id="floor-edge" viewBox="0 0 128 64"><path d="M64 1 127 32 64 63 1 32Z" fill="url(#stone)" stroke="#17120f" stroke-width="1.5"/><path d="M64 1 127 32 64 63 1 32Z" fill="url(#grain)"/><path d="M64 1 127 32 64 63" fill="none" stroke="#947858" stroke-opacity=".32" stroke-width="1.2"/><path d="M1 32 64 63" fill="none" stroke="#0c0908" stroke-opacity=".65" stroke-width="2"/></symbol>
    <symbol id="wall-straight" viewBox="0 0 128 96"><use href="#wall-face" xlink:href="#wall-face"/><use href="#block-top" xlink:href="#block-top"/></symbol>
    <symbol id="wall-moss" viewBox="0 0 128 96"><use href="#wall-face" xlink:href="#wall-face"/><use href="#block-top" xlink:href="#block-top"/><path d="M5 40q10-8 18 1t18 5l5 8-18-4-19-4Zm75-1q12-8 19-3t22-2v8l-22 5-19 4Z" fill="#596044" opacity=".75"/><path d="m18 49 2 8m8-5 1 7m73-13 2 7" stroke="#82905c" opacity=".55"/></symbol>
    <symbol id="wall-arch" viewBox="0 0 128 96"><use href="#wall-face" xlink:href="#wall-face"/><use href="#block-top" xlink:href="#block-top"/><path d="M42 61V47a22 22 0 0 1 44 0v14l-9-4V47a13 13 0 0 0-26 0v14Z" fill="#17120f" stroke="#725b42" stroke-width="2"/><path d="M45 60V47a19 19 0 0 1 38 0" fill="none" stroke="#9a7a54" stroke-opacity=".55"/></symbol>
    <symbol id="wall-corner" viewBox="0 0 128 96"><use href="#wall-face" xlink:href="#wall-face"/><path d="M64 63 127 32V55L84 77 64 87Z" fill="#302720" stroke="#17120f" stroke-width="1.5"/><path d="M64 73 84 83 127 61M64 85 84 95 127 73" fill="none" stroke="#4b3b2e" stroke-width="1"/><use href="#block-top" xlink:href="#block-top"/></symbol>
  </defs>
  <!-- Atlas preview; individual symbols above are the integration interface. -->
  <g transform="translate(0 0)"><use href="#floor-stone" xlink:href="#floor-stone" x="0" y="0"/><use href="#floor-cracked" xlink:href="#floor-cracked" x="128" y="0"/><use href="#floor-moss" xlink:href="#floor-moss" x="256" y="0"/><use href="#floor-rune" xlink:href="#floor-rune" x="384" y="0"/></g>
  <g transform="translate(0 64)"><use href="#floor-blood" xlink:href="#floor-blood" x="0" y="0"/><use href="#floor-rubble" xlink:href="#floor-rubble" x="128" y="0"/><use href="#floor-edge" xlink:href="#floor-edge" x="256" y="0"/><use href="#floor-stone" xlink:href="#floor-stone" x="384" y="0"/></g>
  <g transform="translate(0 160)"><use href="#wall-straight" xlink:href="#wall-straight" x="0" y="0"/><use href="#wall-moss" xlink:href="#wall-moss" x="128" y="0"/><use href="#wall-arch" xlink:href="#wall-arch" x="256" y="0"/><use href="#wall-corner" xlink:href="#wall-corner" x="384" y="0"/></g>
</svg>
